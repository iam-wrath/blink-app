# nginx for Blink: serves the built site and forwards the API and images to the api container.
# Put HTTPS in front of this (your host's load balancer, Caddy, Traefik or certbot).
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Security headers for every response. frame-ancestors * : Blink is meant to be embeddable (?ra=&dec=).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors *" always;

    client_max_body_size 16k;   # the API is read-only: no uploads

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 330s;   # a new search can take a few minutes
    }

    location /data/cache/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Vite's hashed bundles never change: cache them for a year
    location /assets/ {
        expires 1y;
        access_log off;
    }

    # The app's pages live after "#" (/#/explore) and in ?ra=&dec=, so only real files and / exist
    location / {
        try_files $uri $uri/ =404;
    }
}
